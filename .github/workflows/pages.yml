name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate post front matter
        shell: bash
        run: |
          set -euo pipefail
          for file in _posts/*.md; do
            for field in layout title description date tags reading_time; do
              if ! grep -q "^${field}:" "$file"; then
                echo "Missing required front matter field '${field}' in ${file}"
                exit 1
              fi
            done
          done

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          workingDirectory: ./_site
          args: --offline --verbose --no-progress './**/*.html'
          fail: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
